# Backup mirror. Page assets stay document-relative so they resolve under
# /huberman-tolson-cn/ without a <base> tag (a base tag would retarget #section anchors).
# This build passes its own base URL so feed, OPML, and card links point here.
name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and Noto Sans SC
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSansCJKsc-Regular.otf" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSansCJKsc-Bold.otf" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf
          echo "HUB_CJK_FONT=$RUNNER_TEMP/fonts/NotoSansCJKsc-Regular.otf" >> "$GITHUB_ENV"
          echo "HUB_CJK_SANS_BOLD=$RUNNER_TEMP/fonts/NotoSansCJKsc-Bold.otf" >> "$GITHUB_ENV"
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Build published site
        run: python3 scripts/build_site.py --published --out dist --base-url https://tolsonhuddy-collab.github.io/huberman-tolson-cn/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
